# https://wiki.hypr.land/Configuring/Window-Rules/

# Master window rules
windowrule = border_size 1, rounding 1, match:class .*

# Volume Control
windowrule = tag +volume, match:initial_class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = float on, center on, size monitor_w*0.8 monitor_h*0.8, pin on, match:tag volume

# Zen Browser
windowrule = workspace 2, match:class zen
windowrule = center on, float on, size monitor_w*0.8 monitor_h*0.8, match:title ^Save As.*$

# Files
windowrule = tag +files, match:initial_class ^(org.gnome.Nautilus)$
windowrule = tag +files, match:title ^(Save As.*|All Files.*|.*Files.*).*$
windowrule = float on, center on, size monitor_w*0.8 monitor_h*0.8, match:tag files

# Chrome Browser
windowrule = workspace 3 silent, match:class google-chrome

# Slack
windowrule = workspace 4, match:class slack
windowrule = workspace 10, match:title ^(Huddle:.*)$

# Telegram in workspace 8
windowrule = workspace 8, match:class org.telegram.desktop

# Firefox
windowrule = workspace 5, match:class firefox

# Postman
windowrule = workspace 6, match:class Postman

# Hubstaff
windowrule = float on, center on, match:class Netsoft-com.netsoft.hubstaff

# Floating terminal
windowrule = float on, center on, size monitor_w*0.8 monitor_h*0.8, match:class floating-term

# Proton
windowrule = float on, center on, size monitor_w*0.8 monitor_h*0.8, match:class protonvpn-app

# Ledger
windowrule = float on, center on, size monitor_w*0.95 monitor_h*0.9, match:class ^Ledger Wallet$

# Crypto wallets
windowrule = float on, center on, size 500 800, match:title ^(_crx_nkbihfbeogaeaoehlefnkodbefgpgknn|_crx_bhhhlbepdkbapadjdnnojkbgioiodbic|_crx_bfnaelmomeimhlpmgjnjophhpkkoljpa|MetaMask)$

# Zoho
windowrule = float on, center on, size monitor_w*0.95 monitor_h*0.9, match:class Zoho Mail - Desktop

# Gmail
windowrule = float on, center on, size monitor_w*0.95 monitor_h*0.9, match:class chrome-fmgjjmmmlfnkbppncabfkddbjimcfncm-Default

# Discord
windowrule = workspace 7, match:class discord

# Zoom
windowrule = workspace 8, match:class zoom
windowrule = float on, center on, size monitor_w*0.95 monitor_h*0.9, match:class zoom, match:title Meeting

# File Chooser Portal
windowrule = float on, center on, size monitor_w*0.8 monitor_h*0.8, match:class xdg-desktop-portal-gtk

# Images
windowrule = float on, center on, size monitor_w*0.7 monitor_h*0.7, match:class org.gnome.Loupe

# Playwright (Claude Code automated browser)
windowrule = workspace 12 silent, match:class ^PLAYWRIGHT$

# Programs with DEBUG in title go to workspace 11
windowrule = workspace 11 silent, match:title .*DEBUG.*

# Tidal has a minimizable popup
windowrule = float on, center on, size monitor_w*0.95 monitor_h*0.9, match:class tidal-hifi

# Move plots to monitor to
windowrule = monitor DP-2, match:class ^(python3)$

# Steam on 5
windowrule = workspace 5, maximize true, match:class steam

# Games in full screen
windowrule = workspace 5, fullscreen_state 2 0, suppress_event fullscreen, match:class Civ5XP
